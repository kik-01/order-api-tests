<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>陶瓷商城 · 最小下单页</title>
<style>
  body { font-family: sans-serif; max-width: 760px; margin: 24px auto; }
  table { border-collapse: collapse; width: 100%; margin-top: 12px; }
  td, th { border: 1px solid #ccc; padding: 6px 8px; text-align: left; }
  #msg { margin: 10px 0; padding: 8px; background: #f4f4f4; min-height: 1.2em; }
  button { margin-right: 4px; }
</style>
</head>
<body>
<h2>陶瓷商城 · 下单页（UI 层被测对象）</h2>
<p>本页只调用既有 API，不含独立业务逻辑：UI 用例断言页面，再用 API 层同一套对账口径查库。</p>

<label>商品 <select id="product" data-testid="product-select"></select></label>
<label>数量 <input id="qty" data-testid="qty-input" type="number" value="1" min="1"></label>
<button id="submit" data-testid="submit-btn">提交订单</button>
<div id="msg" data-testid="msg"></div>

<table>
  <thead><tr><th>订单号</th><th>数量</th><th>状态</th><th>操作</th></tr></thead>
  <tbody id="orders"></tbody>
</table>

<script>
// 幂等键：一次提交意图共用一个键，成功后才换新键。
// 连点两下提交 = 同一意图重复到达，服务端必须只成一单。
let idem = crypto.randomUUID();
const $ = (s) => document.querySelector(s);
const msg = (t) => { $("#msg").textContent = t; };

async function api(method, path, body) {
  const opt = { method, headers: { "Content-Type": "application/json" } };
  if (body) opt.body = JSON.stringify(body);
  const resp = await fetch(path, opt);
  return { code: resp.status, data: await resp.json().catch(() => ({})) };
}

async function refresh() {
  const products = (await api("GET", "/api/products")).data;
  const sel = $("#product");
  const keep = sel.value;
  sel.innerHTML = products.map(p =>
    `<option value="${p.id}">${p.name}（库存 ${p.stock}）</option>`).join("");
  if (keep) sel.value = keep;

  const orders = (await api("GET", "/api/orders")).data;
  $("#orders").innerHTML = orders.map(o => `
    <tr data-testid="order-row" data-oid="${o.id}">
      <td>${o.id}</td><td>${o.qty}</td>
      <td data-testid="order-status">${o.status}</td>
      <td>
        <button data-testid="pay-btn" data-oid="${o.id}">支付</button>
        <button data-testid="cancel-btn" data-oid="${o.id}">取消</button>
        <button data-testid="refund-btn" data-oid="${o.id}">退款</button>
      </td>
    </tr>`).join("");
}

$("#submit").addEventListener("click", async () => {
  const pid = parseInt($("#product").value, 10);
  const qty = parseInt($("#qty").value, 10);
  const r = await api("POST", "/api/orders",
    { product_id: pid, qty: qty, idempotency_key: idem });
  if (r.code === 201 || r.code === 200) {
    msg(`下单成功：${r.data.id}（${r.data.status}）`);
    idem = crypto.randomUUID();
  } else {
    msg(`下单失败[${r.code}]：${r.data.message || "未知错误"}`);
  }
  await refresh();
});

$("#orders").addEventListener("click", async (e) => {
  const btn = e.target.closest("button[data-oid]");
  if (!btn) return;
  const action = btn.dataset.testid.replace("-btn", "");
  const r = await api("POST", `/api/orders/${btn.dataset.oid}/${action}`);
  msg(r.code === 200
    ? `操作成功：${r.data.id} → ${r.data.status}`
    : `操作失败[${r.code}]：${r.data.message || "未知错误"}`);
  await refresh();
});

refresh();
</script>
</body>
</html>
