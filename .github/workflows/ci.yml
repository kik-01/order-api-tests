name: order-api-tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate performance test assets
        run: |
          python -m py_compile perf/run_load_test.py
          python -c "import xml.etree.ElementTree as ET; ET.parse('perf/order_api_load_test.jmx')"

      - name: Run tests
        run: pytest -q

      - name: Show xfail reasons
        if: always()
        run: pytest -q -rx

  ui-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ui.txt

      - name: Install Playwright chromium
        run: python -m playwright install --with-deps chromium

      - name: Run UI tests
        run: pytest -q -m ui

  mysql-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testroot
          MYSQL_DATABASE: shop_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptestroot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-mysql.txt

      - name: MySQL server info
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          MYSQL_USER: root
          MYSQL_PASSWORD: testroot
          MYSQL_DATABASE: shop_test
        run: |
          python - <<'PY'
          import os, pymysql
          c = pymysql.connect(host=os.environ["MYSQL_HOST"], port=int(os.environ["MYSQL_PORT"]),
                              user=os.environ["MYSQL_USER"], password=os.environ["MYSQL_PASSWORD"],
                              database=os.environ["MYSQL_DATABASE"])
          print("server:", c.get_server_info())
          cur = c.cursor()
          cur.execute("SELECT @@sql_mode, @@transaction_isolation, @@lower_case_table_names")
          print(cur.fetchone())
          PY

      - name: Run tests on MySQL
        env:
          SHOP_DB: mysql
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          MYSQL_USER: root
          MYSQL_PASSWORD: testroot
          MYSQL_DATABASE: shop_test
        shell: bash
        run: |
          set -o pipefail
          pytest -q --tb=line -rfE 2>&1 | tee mysql_ci.log

      - name: Run concurrency probe (25 rounds)
        env:
          SHOP_DB: mysql
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          MYSQL_USER: root
          MYSQL_PASSWORD: testroot
          MYSQL_DATABASE: shop_test
        shell: bash
        run: |
          set -o pipefail
          python perf/race_probe.py --rounds 25 2>&1 | tee probe_ci.log

      - name: Publish MySQL result to run summary
        if: always()
        shell: bash
        run: |
          {
            echo '## MySQL CI result'
            echo '```'
            tail -n 40 mysql_ci.log 2>/dev/null || echo '(no test log)'
            echo '--- probe ---'
            tail -n 12 probe_ci.log 2>/dev/null || echo '(no probe log)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
