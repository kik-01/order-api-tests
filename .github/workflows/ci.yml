name: order-api-tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate performance test assets
        run: |
          python -m py_compile perf/run_load_test.py
          python -c "import xml.etree.ElementTree as ET; ET.parse('perf/order_api_load_test.jmx')"

      - name: Run tests
        run: pytest -q

      - name: Show xfail reasons
        if: always()
        run: pytest -q -rx
